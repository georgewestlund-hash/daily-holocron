name: Refresh schedule and deploy board

on:
  schedule:
    # Every 6 hours, at :13 past to stay off the busy top-of-hour tick. Times are UTC.
    - cron: '13 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: classroom-board
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Re-extract schedule from Google Slides
        shell: pwsh
        run: ./extract-schedule.ps1

      - name: Commit schedule.json if it changed
        run: |
          if [ -n "$(git status --porcelain docs/data/schedule.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/data/schedule.json
            git commit -m "chore: refresh schedule from slides deck"
            git push
          else
            echo "No change in schedule.json"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
